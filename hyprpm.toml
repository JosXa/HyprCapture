[repository]
name = "HyprCapture"
authors = ["wilf"]
commit_pins = [
    ["39d7e209c79d451efab1b21151d5938289da838d", "58f81240072e9006891920e2f1efec263d7368a4"]
]

[hyprcapture]
description = "Hyprland-only screenshot overlay"
authors = ["wilf"]
output = "build-hyprpm/libhyprcapture.so"
build = [
    "cmake -S . -B build-hyprpm -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build-hyprpm",
    "ctest --test-dir build-hyprpm --output-on-failure",
    "install -Dm755 build-hyprpm/hyprcapture-ui \"$HOME/.local/bin/hyprcapture-ui\""
]
